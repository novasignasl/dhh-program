<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:transparent;
}

.chapter-status{
  padding:12px 16px;
  margin-bottom:12px;
  background:#f8fafc;
  border:1px solid #dbe3ea;
  border-radius:8px;
  font-size:16px;
  font-weight:500;
}

.chapter-status strong{
  color:#2563eb;
}

.chapter-chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.chip{
  padding:8px 14px;
  border:1px solid #d0d0d0;
  border-radius:999px;
  background:#f5f5f5;
  cursor:pointer;
  font-size:14px;
}

.chip.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.video-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
}

.video-wrap iframe{
  position:absolute;
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<div class="chapter-status">
  Now Playing:
  <strong id="currentChapter">Bathtub is Filling Up</strong>
</div>

<div class="chapter-chips">
  <button class="chip active" data-time="0">0:00 Bathtub is Filling Up</button>
  <button class="chip" data-time="10">0:10 Bathroom?</button>
  <button class="chip" data-time="20">0:20 Dirty need bath</button>
  <button class="chip" data-time="30">0:30 Clothes Off</button>
  <button class="chip" data-time="40">0:40 Water OK?</button>
</div>

<div class="video-wrap">
  <iframe
    id="vimeo-player"
    src="https://player.vimeo.com/video/1190358519?h=4639008b9d"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>

<script>
const player = new Vimeo.Player(document.getElementById('vimeo-player'));

const chips = document.querySelectorAll('.chip');
const currentChapter = document.getElementById('currentChapter');

const chapters = [
  { time: 0, title: 'Bathtub is Filling Up' },
  { time: 10, title: 'Bathroom?' },
  { time: 20, title: 'Dirty need bath' },
  { time: 30, title: 'Clothes Off' },
  { time: 40, title: 'Water OK?' }
];

function setActiveChapter(index){
  chips.forEach(chip => chip.classList.remove('active'));

  if(chips[index]){
    chips[index].classList.add('active');
    currentChapter.textContent = chapters[index].title;
  }
}

chips.forEach((chip, index) => {
  chip.addEventListener('click', () => {
    player.setCurrentTime(chapters[index].time)
      .then(() => player.play());

    setActiveChapter(index);
  });
});

player.on('timeupdate', data => {
  let activeIndex = 0;

  chapters.forEach((chapter, index) => {
    if(data.seconds >= chapter.time){
      activeIndex = index;
    }
  });

  setActiveChapter(activeIndex);
});
</script>

</body>
</html>
